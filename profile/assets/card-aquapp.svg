<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a5c"/>
      <stop offset="1" stop-color="#05506e"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e6fd9"/>
      <stop offset="1" stop-color="#19b8d6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="600" height="300" rx="24"/></clipPath>
    <style>
      .name { font: 800 44px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .meta { font: 500 20px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #cfe6f5; }
      .pill { font: 700 14px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #062a5c; letter-spacing: 1.5px; }
      .drop { transform-origin: 104px 112px; animation: bob 3.5s ease-in-out infinite; }
      .ripple { transform-origin: 104px 160px; animation: ripple 3.5s ease-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes ripple { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <path fill="#19b8d6" fill-opacity="0.18" d="M0 240 Q75 220 150 240 T300 240 T450 240 T600 240 L600 300 L0 300 Z"/>
    <rect x="44" y="52" width="120" height="120" rx="28" fill="url(#icon)"/>
    <ellipse class="ripple" cx="104" cy="160" rx="34" ry="8" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <path class="drop" fill="#ffffff" d="M104 76 C104 76 78 106 78 124 a26 26 0 0 0 52 0 C130 106 104 76 104 76 Z"/>
    <text x="196" y="104" class="name">AquApp</text>
    <text x="198" y="140" class="meta">Our first app · iPhone</text>
    <rect x="44" y="204" width="168" height="34" rx="17" fill="#6fdcb4"/>
    <text x="128" y="226" class="pill" text-anchor="middle">IN DEVELOPMENT</text>
  </g>
</svg>
