<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <clipPath id="frame"><rect width="600" height="300" rx="24"/></clipPath>
    <clipPath id="icon"><rect x="44" y="52" width="120" height="120" rx="28"/></clipPath>
    <style>
      .name { font: 800 44px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #EEF0FF; letter-spacing: -1px; }
      .meta { font: 500 20px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #8A90B8; }
      .train { animation: roll 6s linear infinite; }
      @keyframes roll { from { transform: translateX(-180px); } to { transform: translateX(620px); } }
      .pill { font: 700 14px -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #07080D; letter-spacing: 1.5px; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="300" fill="#07080D"/>
    <!-- track -->
    <line x1="0" y1="272" x2="600" y2="272" stroke="#181B36" stroke-width="4"/>
    <g stroke="#181B36" stroke-width="2">
      <line x1="20" y1="266" x2="20" y2="278"/><line x1="80" y1="266" x2="80" y2="278"/><line x1="140" y1="266" x2="140" y2="278"/><line x1="200" y1="266" x2="200" y2="278"/><line x1="260" y1="266" x2="260" y2="278"/><line x1="320" y1="266" x2="320" y2="278"/><line x1="380" y1="266" x2="380" y2="278"/><line x1="440" y1="266" x2="440" y2="278"/><line x1="500" y1="266" x2="500" y2="278"/><line x1="560" y1="266" x2="560" y2="278"/>
    </g>
    <!-- train: starts off-card on the left, rolls across, loops -->
    <g class="train">
      <rect x="0" y="252" width="52" height="16" rx="5" fill="#9D5CFF"/>
      <rect x="56" y="252" width="52" height="16" rx="5" fill="#00E5FF"/>
      <path d="M112 252 h40 a14 16 0 0 1 14 16 h-54 z" fill="#FF2E88"/>
      <g fill="#07080D"><rect x="8" y="256" width="10" height="6" rx="2"/><rect x="24" y="256" width="10" height="6" rx="2"/><rect x="64" y="256" width="10" height="6" rx="2"/><rect x="80" y="256" width="10" height="6" rx="2"/><rect x="120" y="256" width="10" height="6" rx="2"/><rect x="136" y="256" width="14" height="6" rx="2"/></g>
      <g fill="#EEF0FF"><circle cx="12" cy="270" r="3"/><circle cx="40" cy="270" r="3"/><circle cx="68" cy="270" r="3"/><circle cx="96" cy="270" r="3"/><circle cx="124" cy="270" r="3"/><circle cx="152" cy="270" r="3"/></g>
      <circle cx="164" cy="262" r="2.5" fill="#FFE14D"/>
    </g>
    <g clip-path="url(#icon)">
      <rect x="44" y="52" width="120" height="120" fill="#0F1122"/>
      <g transform="translate(44 52) scale(1.25)">
        <path d="M66 24 H38 a12 12 0 0 0 0 24 h20 a12 12 0 0 1 0 24 H30" fill="none" stroke="#FF2E88" stroke-width="9" stroke-linecap="round"/>
        <circle cx="66" cy="24" r="6" fill="#EEF0FF"/><circle cx="48" cy="48" r="5" fill="#EEF0FF"/><circle cx="30" cy="72" r="6" fill="#EEF0FF"/>
      </g>
    </g>
    <text x="196" y="104" class="name">Studyground</text>
    <text x="198" y="140" class="meta">Study timer · metro &amp; train</text>
    <rect x="44" y="204" width="168" height="34" rx="17" fill="#00E5FF"/>
    <text x="128" y="226" class="pill" text-anchor="middle">IN DEVELOPMENT</text>
  </g>
</svg>
