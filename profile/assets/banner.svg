<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041128"/>
      <stop offset="0.55" stop-color="#062a5c"/>
      <stop offset="1" stop-color="#05506e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6fd9"/>
      <stop offset="0.5" stop-color="#19b8d6"/>
      <stop offset="1" stop-color="#6fdcb4"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6fd9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#19b8d6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19b8d6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fdcb4" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19b8d6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#19b8d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" gradientUnits="userSpaceOnUse" x1="1045" y1="95" x2="1195" y2="245">
      <stop offset="0" stop-color="#1e6fd9"/>
      <stop offset="0.5" stop-color="#19b8d6"/>
      <stop offset="1" stop-color="#6fdcb4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
    <style>
      .title { font: 800 96px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2px; }
      .sub { font: 500 30px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #cfe6f5; }
      .tag { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #6fdcb4; }
      .w1 { animation: drift 14s linear infinite; }
      .w2 { animation: drift 9s linear infinite reverse; }
      .pulse { transform-origin: 1120px 170px; animation: pulse 3.2s ease-in-out infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-640px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <circle cx="1120" cy="170" r="230" fill="url(#glow)"/>
    <circle cx="140" cy="40" r="160" fill="url(#glow)" opacity="0.6"/>

    <!-- waves: each path is two identical 640px periods so the drift loops seamlessly -->
    <g class="w1">
      <path fill="url(#wave1)" d="M0 330 Q160 290 320 330 T640 330 T960 330 T1280 330 T1600 330 T1920 330 L1920 420 L0 420 Z"/>
    </g>
    <g class="w2">
      <path fill="url(#wave2)" d="M0 360 Q160 392 320 360 T640 360 T960 360 T1280 360 T1600 360 T1920 360 L1920 420 L0 420 Z"/>
    </g>

    <!-- brand cross -->
    <g class="float">
      <g class="pulse">
        <g fill="url(#cross)">
          <rect x="1085" y="95" width="70" height="150" rx="22"/>
          <rect x="1045" y="135" width="150" height="70" rx="22"/>
        </g>
        <path fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M1057 172 h32 l12 -26 l20 54 l16 -40 l9 12 h37"/>
      </g>
    </g>

    <text x="96" y="118" class="tag">INDEPENDENT HEALTH STUDIO</text>
    <text x="90" y="222" class="title" fill="url(#brand)">FEA Health</text>
    <text x="96" y="276" class="sub">Simple iOS apps for everyday health.</text>
  </g>
</svg>
